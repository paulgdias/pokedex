<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta name="color-scheme" content="light dark" />
        <script>
            // set the theme before first paint to avoid a light flash
            (function () {
                try {
                    var saved = localStorage.getItem("theme");
                    var dark =
                        saved === "dark" ||
                        (saved !== "light" &&
                            matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.dataset.theme = dark
                        ? "dark"
                        : "light";
                } catch (e) {}
            })();
        </script>
        <title>Pokémon Trainer Guide</title>
        <meta name="description" content="Pokémon Trainer Guide" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        />
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
